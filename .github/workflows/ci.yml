name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          # 桌面/通话适配器的 remote 冒烟也要跑（缺依赖时测试会 skip，但不该靠 skip 混过 CI）
          pip install -r requirements-desktop.txt
      - name: Regression suite (no API key needed)
        run: python tests/test_regression.py
      - name: Recall gate (no API key needed)
        run: python tools/eval_memory.py --min-recall 0.8 --min-holdout 0.7
      - name: Offline demo (no API key needed)
        run: python examples/demo.py
