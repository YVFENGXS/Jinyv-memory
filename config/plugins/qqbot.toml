# QQ 插件（OneBot v11 / NoneBot2）
enabled = true
default_account = "owner_qq"
# 适配层默认不额外节流；线上可在平台侧或迁移阶段恢复
reply_cooldown_seconds = 0
# auto = 装了 nonebot 就接消息入口，没装则降级为工具/钩子
nonebot = "auto"
# 插件实现：E:/Jinyv-plugins/qqbot（远程待确认）
# 能力实现已在插件仓库 qqbot/features/；不再依赖旧目录。
# 仅在需要旧 __init__.py 的主动话题/命令逻辑时，才配置回退目录。
legacy_source_dir = ""
