<text x="30" y="620" font-size="15" font-weight="600" fill="#1f2328">读数</text>
<text x="30" y="644" font-size="12.5" fill="#374151">1. 真实语料上向量把主私聊 recall@4 从 0.183 拉到 0.683，群聊从 0.519 拉到 0.852。</text>
<text x="30" y="666" font-size="12.5" fill="#374151">2. 注入率与 recall 的差距来自披露层：合成小集有 32% 的命中卡被降级为固定句，回答准确率随之从 0.850 掉到 0.700。</text>
<text x="30" y="688" font-size="12.5" fill="#374151">3. 披露层在真实主私聊只影响 1/60（0.700→0.683），代价集中在「弱字面命中 + 互补向量」的合成场景。</text>
<text x="30" y="710" font-size="11.5" fill="#9ca3af">合成规模集未跑「披露关闭 + 真实回答」，注入 0.950→1.000 为离线对照。</text>
