<text x="30" y="60" font-size="12.5" fill="#6b7280">DeepSeek 4.1 Flash · BAAI/bge-m3 · 2026-10-30 · 线上库快照：349 张卡 / 1770 轮 / 250 条词条</text>
<text x="30" y="79" font-size="11.5" fill="#9ca3af">真实语料问句由固定协议从真实用户消息抽取（主私聊 60 条 / 群聊 27 条），非人工挑选</text>
<text x="30" y="116" font-size="15" font-weight="600" fill="#1f2328">recall@4：目标卡是否进入前 4（灰=纯关键词；蓝=关键词+向量）</text>
